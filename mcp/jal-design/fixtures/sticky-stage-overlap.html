<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sticky stage in content fixture</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #ffffff; color: #1f2933; font-family: sans-serif; }
  .intro { height: 1200px; margin: 0; padding: 24px; }
  /* A tall sticky stage in the content flow, below the fold. It reaches past
     the viewport bottom but is not an edge bar, so the paragraph it covers
     is a real overlap. */
  #sticky-stage { position: sticky; top: 0; height: 700px; background: #e5e7eb; }
  #covered-copy { position: relative; margin: -300px 0 0 0; padding: 24px; }
</style>
</head>
<body>
<main id="flow">
  <p class="intro">Intro copy that pushes the stage below the fold.</p>
  <div id="sticky-stage"></div>
  <p id="covered-copy">Copy that sits under the sticky stage.</p>
</main>
</body>
</html>
