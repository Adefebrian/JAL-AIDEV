<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>backdrop canvas fixture</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #fafaf9; color: #1b1b1b; font-family: sans-serif; }
  .stage { position: relative; min-height: 400px; padding: 24px; }
  .backdrop { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .copy { position: relative; }
  .blocker { position: absolute; inset: 0; width: 100%; height: 100%; }
</style>
</head>
<body>
<main>
  <section class="stage" id="ok-stage">
    <canvas class="backdrop" aria-hidden="true"></canvas>
    <div class="copy"><h2>Content over a decorative canvas</h2></div>
  </section>
  <section class="stage" id="bad-stage">
    <canvas class="blocker"></canvas>
    <div class="copy"><h2>Content under an interactive layer</h2></div>
  </section>
</main>
</body>
</html>
