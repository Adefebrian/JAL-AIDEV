<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>good fixture</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #ffffff;
    color: #1f2933;
    font-family: sans-serif;
  }
  /* App-shell: header, independently scrolling content, bottom tab bar
     below 640px; the tab bar moves into the header row from 640px. */
  .shell {
    display: grid;
    height: 100dvh;
    grid-template-rows: auto minmax(0, 1fr) auto;
    grid-template-areas: "header" "main" "nav";
  }
  .shell-header { grid-area: header; display: flex; align-items: center; min-height: 56px; padding: 0 16px; border-bottom: 1px solid #e5e7eb; background: #ffffff; }
  .shell-header h1 { margin: 0; font-size: 19px; line-height: 28px; }
  .shell-main { grid-area: main; min-height: 0; overflow-y: auto; }
  .shell-nav { grid-area: nav; display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); border-top: 1px solid #e5e7eb; background: #ffffff; }
  .shell-nav a { display: flex; align-items: center; justify-content: center; min-height: 56px; min-width: 0; color: #1f2933; text-decoration: none; }
  @media (min-width: 640px) {
    .shell { grid-template-rows: auto minmax(0, 1fr); grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "header nav" "main main"; }
    .shell-nav { grid-auto-columns: auto; border-top: 0; border-bottom: 1px solid #e5e7eb; padding: 0 8px; }
    .shell-nav a { padding: 0 16px; }
  }
  .wrap { max-width: 960px; margin: 0 auto; padding: 24px; }
  .panel {
    background: #f9fafb;
    border: 1px solid #e5e7eb;
    padding: 16px;
    margin-bottom: 16px;
  }
  .form-row {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 12px;
    margin-bottom: 16px;
  }
  .form-row input,
  .form-row select {
    height: 44px;
    width: 100%;
    min-width: 0;
    padding: 0 28px 0 12px;
    border: 1px solid #d1d5db;
    background: #ffffff;
  }
  .card-row {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 16px;
    margin-bottom: 16px;
  }
  .card {
    min-width: 0;
    border: 1px solid #e5e7eb;
    background: #ffffff;
    padding: 16px;
  }
  .card p { margin: 0; }
  h2 { margin: 0 0 16px 0; }
</style>
</head>
<body>
<div class="shell">
<header class="shell-header"><h1>Good fixture</h1></header>
<main class="shell-main">
<div class="wrap">
  <h2>Account details</h2>
  <div class="panel">
    <p>All fields below are normalized to a consistent forty four pixel control height.</p>
  </div>
  <div class="form-row">
    <input type="text" placeholder="First name" />
    <input type="text" placeholder="Last name" />
    <select><option>Country</option></select>
  </div>
  <div class="card-row">
    <div class="card"><p>Card one holds a short summary line of similar length to its neighbor.</p></div>
    <div class="card"><p>Card two holds a short summary line of similar length to its neighbor.</p></div>
  </div>
</div>
</main>
<nav class="shell-nav" aria-label="Primary">
  <a href="#account">Account</a>
  <a href="#cards">Cards</a>
</nav>
</div>
</body>
</html>
