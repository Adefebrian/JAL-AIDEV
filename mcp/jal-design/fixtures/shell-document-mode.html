<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>document mode app-shell fixture</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #ffffff; color: #1f2933; font-family: sans-serif; }
  /* App-shell in document-scroll mode: a sticky header and a fixed bottom
     tab bar sit over the scrolling main by design. */
  #doc-header { position: sticky; top: 0; display: flex; align-items: center; min-height: 56px; padding: 0 16px; background: #ffffff; border-bottom: 1px solid #e5e7eb; }
  #doc-header h1 { margin: 0; font-size: 19px; line-height: 28px; }
  #doc-main { padding: 16px 16px 72px; }
  #doc-main p { margin: 0 0 16px 0; min-height: 200px; }
  #doc-tabs { position: fixed; left: 0; right: 0; bottom: 0; display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); background: #ffffff; border-top: 1px solid #e5e7eb; }
  #doc-tabs a { display: flex; align-items: center; justify-content: center; min-height: 56px; color: #1f2933; text-decoration: none; }
</style>
</head>
<body>
<header id="doc-header"><h1>Document shell</h1></header>
<main id="doc-main">
  <p>First block of scrolling content.</p>
  <p>Second block of scrolling content.</p>
  <p>Third block of scrolling content.</p>
  <p>Fourth block of scrolling content.</p>
  <p>Fifth block of scrolling content.</p>
  <p>Sixth block of scrolling content.</p>
  <p>Seventh block of scrolling content.</p>
</main>
<nav id="doc-tabs" aria-label="Primary">
  <a href="#home">Home</a>
  <a href="#search">Search</a>
  <a href="#profile">Profile</a>
</nav>
</body>
</html>
